[project]
name = "pidemo"
version = "0.1.0"
description = "Platform-independent LangChain summarization service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.2",
    "langchain>=1.5,<2",
    "langchain-core>=1.8,<2",
    "langchain-ollama>=1.1,<2",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pidemo = "pidemo.api:main"

[project.optional-dependencies]
openai = [
    "langchain-openai>=1,<2",
]
anthropic = [
    "langchain-anthropic>=1,<2",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
