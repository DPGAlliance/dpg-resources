services:
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pulls the model into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-llama3.2:1b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      args:
        EXTRA: ${EXTRA:-}
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
      LLM_BASE_URL: ${LLM_BASE_URL-http://ollama:11434}
      TRACING: ${TRACING:-local}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - traces:/app/traces
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama:
  traces:
